<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Lookup</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #17212b;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4f9dde;
    --border: #2a3540;
    --error: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    min-height: 100vh;
  }
  .card { width: 100%; max-width: 480px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; line-height: 1.4; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .result {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 16px;
    display: none;
  }
  .result.visible { display: block; }
  .field {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .field:last-child { border-bottom: none; }
  .field .k { color: var(--muted); }
  .field .v { font-weight: 600; text-align: right; word-break: break-word; }
  .error {
    margin-top: 16px;
    color: var(--error);
    font-size: 0.88rem;
    display: none;
    line-height: 1.4;
  }
  .error.visible { display: block; }
  .hint {
    margin-top: 24px;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.5;
  }
  code {
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.85em;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Score Lookup</h1>
  <p class="sub">Enter a register number to fetch its record from the API.</p>
  <div class="row">
    <input id="regInput" placeholder="Register number" autocomplete="off" />
    <button id="fetchBtn">Fetch</button>
  </div>
  <div id="result" class="result"></div>
  <div id="error" class="error"></div>
  <p class="hint">
    If you get a "Failed to fetch" error, it's most likely CORS: the API needs to send
    <code>Access-Control-Allow-Origin</code> headers for your page's domain to be allowed to read the response.
  </p>
</div>

<script>
  const API_BASE = "https://hire-score-fawn.vercel.app/api/scores/";
  const input = document.getElementById("regInput");
  const btn = document.getElementById("fetchBtn");
  const resultEl = document.getElementById("result");
  const errorEl = document.getElementById("error");

  async function fetchScore() {
    const reg = input.value.trim();
    resultEl.classList.remove("visible");
    errorEl.classList.remove("visible");
    resultEl.innerHTML = "";
    errorEl.textContent = "";

    if (!reg) {
      errorEl.textContent = "Enter a register number first.";
      errorEl.classList.add("visible");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Loading...";

    try {
      const res = await fetch(API_BASE + encodeURIComponent(reg));
      if (!res.ok) {
        throw new Error("No record found (status " + res.status + ")");
      }
      const data = await res.json();
      renderResult(data);
    } catch (err) {
      errorEl.textContent = err.message.includes("fetch")
        ? "Request failed — likely CORS or the API is unreachable. See note below."
        : err.message;
      errorEl.classList.add("visible");
    } finally {
      btn.disabled = false;
      btn.textContent = "Fetch";
    }
  }

  function renderResult(data) {
    resultEl.innerHTML = "";
    const entries = Object.entries(data);
    if (entries.length === 0) {
      errorEl.textContent = "API returned an empty object.";
      errorEl.classList.add("visible");
      return;
    }
    for (const [key, value] of entries) {
      const row = document.createElement("div");
      row.className = "field";
      const k = document.createElement("span");
      k.className = "k";
      k.textContent = key;
      const v = document.createElement("span");
      v.className = "v";
      v.textContent = typeof value === "object" ? JSON.stringify(value) : value;
      row.appendChild(k);
      row.appendChild(v);
      resultEl.appendChild(row);
    }
    resultEl.classList.add("visible");
  }

  btn.addEventListener("click", fetchScore);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") fetchScore();
  });
</script>
</body>
</html>
